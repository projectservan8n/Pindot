<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Deskhand activity</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 12px -apple-system, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
  header { position: sticky; top: 0; padding: 8px 12px; background: Canvas; border-bottom: 1px solid rgba(128,128,128,.3); }
  header .path { opacity: .6; font-size: 11px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 4px 8px; border-bottom: 1px solid rgba(128,128,128,.15); vertical-align: top; }
  td.ts { white-space: nowrap; opacity: .7; font-variant-numeric: tabular-nums; }
  td.tool { font-weight: 600; white-space: nowrap; }
  td.args { font-family: ui-monospace, Menlo, monospace; word-break: break-word; }
  tr.fail td.outcome { color: #c62828; }
  tr.new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(255, 45, 149, .25); } to { background: transparent; } }
</style>
</head>
<body>
  <header><b>Every action Claude took</b> (newest first) <div class="path" id="path"></div></header>
  <table><tbody id="rows"></tbody></table>
  <script src="activity.js"></script>
</body>
</html>
