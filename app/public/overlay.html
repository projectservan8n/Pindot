<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pindot overlay</title>
<style>
  /* The AI cursor: Pindot's "second hand", pink unless the user picks another
     colour (Settings). One accent (the agent's colour; overlay.js rewrites
     the --accent* variables from it), dark glass for everything that carries text, white outlines so
     every mark reads on light and dark apps alike. */
  :root {
    --accent: #ff2d95;
    --accent-lit: #ff7cb9;
    --accent-deep: #cf1673;
    --accent-glow: rgba(255, 45, 149, 0.5);
    --accent-rgb: 255, 45, 149;
    --ink: #15151b; /* the eyes; near-white on a dark cursor colour */
    --glass: rgba(17, 17, 21, 0.88);
    --glass-edge: rgba(255, 255, 255, 0.12);
    --paper: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.64);
    --warn: #ffb300;
    --ok: #2ec27e;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    --lift: 0 8px 22px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.35);
    --snap: cubic-bezier(0.2, 0, 0, 1);
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { pointer-events: none; user-select: none; -webkit-user-select: none; font-family: var(--ui);
         -webkit-font-smoothing: antialiased; color: var(--paper); }

  /* ---- paths: comet trail and drag line, under the cursor */
  #paths { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #drag-under, #drag-path { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0;
                            transition: opacity 220ms ease; }
  #drag-under { stroke: rgba(255, 255, 255, 0.5); stroke-width: 3.5; }
  #drag-path { stroke: var(--accent); stroke-width: 2.25; stroke-dasharray: 0.1 7; }
  body.dragging #drag-under, body.dragging #drag-path { opacity: 0.95; }

  /* ---- one-shot marks (ripples, chevrons), placed in screen coordinates */
  #fx { position: absolute; inset: 0; }
  .mark { position: absolute; left: 0; top: 0; box-sizing: border-box; }
  .ring { width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; }
  .ring-click { border: 3px solid var(--accent);
                box-shadow: 0 0 16px var(--accent-glow), inset 0 0 0 1px rgba(255, 255, 255, 0.55); }
  .ring-right { border: 3px dashed var(--accent);
                filter: drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 6px var(--accent-glow)); }
  .ring-press { border: 2px solid #fff; box-shadow: 0 0 0 2px var(--accent), 0 0 20px var(--accent-glow); }
  .ring-spot { width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 1.5px solid rgba(255, 255, 255, 0.92);
               background: radial-gradient(circle, rgba(var(--accent-rgb), 0.24), rgba(var(--accent-rgb), 0) 68%);
               box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.55); }
  .ring-drop { width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #fff;
               box-shadow: 0 0 0 1.5px var(--accent); }
  .tip-dot { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff;
             box-shadow: 0 0 0 2px var(--accent), 0 0 12px var(--accent-glow); }
  .chev { width: 16px; height: 10px; margin: -5px 0 0 -8px; }
  .chev svg { display: block; overflow: visible; }
  .chev-stroke { stroke: var(--accent); }

  /* ---- the cursor. #cursor sits on the tip; #pose takes taps and grabs;
     #lean banks into the motion. All three pivot on the tip. */
  #cursor { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 160ms ease; will-change: transform; }
  body.cursor-on #cursor { opacity: 1; }
  body.cursor-on #cursor.away { opacity: 0; }
  #pose, #lean { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  body.resting #pose { opacity: 0.86; transition: opacity 400ms ease; }
  #arrow { position: absolute; left: -2px; top: -1px; display: block; overflow: visible;
           filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.32)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.45)); }

  /* The cursor's colours. These live here, in the style sheet, and never in
     a style="..." attribute: the app's content security policy drops every
     style attribute in the markup (Tauri adds a nonce, which switches
     'unsafe-inline' off), and a stop with no colour is black. The
     stop-color attributes are the pink fallback. */
  .stop-lit { stop-color: var(--accent-lit); }
  .stop-accent { stop-color: var(--accent); }
  .stop-deep { stop-color: var(--accent-deep); }

  /* Rusty's eyes. Only transforms and fills, so nothing forces layout.
     fill-box keeps every squash around the eyes' own centre in WebKit and
     Chromium alike. */
  #eyes, #eyes-x, .eye { transform-box: fill-box; transform-origin: center; }
  .eye { fill: var(--ink); transition: transform 65ms ease-out, fill 200ms ease; }
  .eye.blink { transform: scaleY(0.08); transition-duration: 55ms; }
  #eyes { transition: transform 90ms linear; }
  #eyes-x { transition: transform 240ms ease; }
  #arrow[data-eyes="listening"] #eyes-x { transform: scale(1.14, 1.2); }
  #arrow[data-eyes="thinking"] #eyes-x { animation: glance 3600ms ease-in-out infinite; }
  #arrow[data-eyes="speaking"] #eyes-x { animation: chatter 760ms ease-in-out infinite; }
  #arrow[data-eyes="squint"] #eyes-x { transform: scaleY(0.4); transition-duration: 60ms; }
  #arrow[data-eyes="sleepy"] #eyes-x { transform: translateY(4px) scaleY(0.42); transition-duration: 900ms; }
  #arrow[data-eyes="closed"] #eyes-x { transform: scaleY(0.08); transition-duration: 70ms; }
  @keyframes glance { 0%, 100% { transform: translate(-6px, -5px); } 50% { transform: translate(6px, -5px); } }
  @keyframes chatter { 50% { transform: scaleY(0.72); } }
  @media (prefers-reduced-motion: reduce) {
    #eyes { transform: none !important; }
    #eyes-x { animation: none !important; transform: none !important; }
  }
  #halo { position: absolute; left: -14px; top: -12px; width: 46px; height: 46px; border-radius: 50%;
          background: radial-gradient(circle, rgba(var(--accent-rgb), 0.5), rgba(var(--accent-rgb), 0) 68%);
          opacity: 0.3; transform-origin: 23px 23px; }
  body.acting #halo { animation: breathe 1600ms ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.6; transform: scale(1.18); } }
  #grip { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #fff;
          box-shadow: 0 0 0 2px var(--accent), 0 0 12px var(--accent-glow); opacity: 0; transform: scale(0.4);
          transition: opacity 120ms ease, transform 160ms var(--snap); }
  body.dragging #grip { opacity: 1; transform: scale(1); }

  /* The name tag hangs off the arrow like a collaborator's cursor tag. */
  #tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; max-width: 300px;
         padding: 4px 10px 4px 5px; border-radius: 3px 11px 11px 11px; background: var(--accent);
         box-shadow: var(--lift), inset 0 1px 0 rgba(255, 255, 255, 0.25); color: #fff; white-space: nowrap;
         font: 500 12px/16px var(--ui); letter-spacing: 0.01em; transform-origin: 0 0;
         transition: opacity 200ms ease; }
  #tag.flip-x { border-radius: 11px 3px 11px 11px; }
  #tag.flip-y { border-radius: 11px 11px 11px 3px; }
  #tag.flip-x.flip-y { border-radius: 11px 11px 3px 11px; }
  #tag.empty, body.resting #tag { opacity: 0; }
  #tag.no-verb { padding-left: 10px; }
  #verb { padding: 1px 6px; border-radius: 7px; background: rgba(255, 255, 255, 0.24); font-weight: 600;
          font-size: 11px; letter-spacing: 0.02em; }
  #verb:empty { display: none; }
  #name { overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  #name:empty { display: none; }
  #name.coords { font-family: var(--mono); font-size: 11px; opacity: 0.88; letter-spacing: 0; }

  /* ---- companion: while you talk the tag shows your voice; while Claude
     thinks, three dots. Bars and dots are the same five <i>s. */
  #buddy { display: none; align-items: center; gap: 2px; height: 16px; padding: 0 2px; }
  #tag[data-buddy="listening"] #buddy, #tag[data-buddy="thinking"] #buddy { display: flex; }
  #buddy i { display: block; width: 3px; height: 4px; border-radius: 2px; background: #fff;
             transition: height 70ms linear; }
  #tag[data-buddy="thinking"] #buddy i:nth-child(n+4) { display: none; }
  #tag[data-buddy="thinking"] #buddy i { width: 5px; height: 5px; border-radius: 50%;
             animation: hop 900ms ease-in-out infinite; }
  #tag[data-buddy="thinking"] #buddy i:nth-child(2) { animation-delay: 120ms; }
  #tag[data-buddy="thinking"] #buddy i:nth-child(3) { animation-delay: 240ms; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: 0.55; }
                   30% { transform: translateY(-3px); opacity: 1; } }
  #tag[data-buddy] { padding: 4px 9px; }

  /* ---- what Claude says, typed out beside the cursor as it is spoken */
  #caption { position: absolute; left: 0; top: 0; display: none; max-width: 320px;
             max-height: 90px; overflow: hidden; padding: 9px 13px; border-radius: 4px 14px 14px 14px;
             background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--lift);
             font: 500 13px/18px var(--ui); letter-spacing: 0; color: var(--paper);
             -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px);
             mask-image: linear-gradient(to bottom, transparent 0, #000 14px); }
  #caption.short { -webkit-mask-image: none; mask-image: none; }
  #caption.show { display: block; }
  #caption.flip-x { border-radius: 14px 4px 14px 14px; }
  #caption.flip-y { border-radius: 14px 14px 14px 4px; }

  /* ---- keys and typing, shown beside the cursor */
  #hud { position: absolute; left: 0; top: 0; display: none; }
  #hud.show { display: block; }
  .keys { display: flex; align-items: flex-end; gap: 5px; }
  .cap { min-width: 26px; height: 27px; box-sizing: border-box; padding: 0 8px; border-radius: 7px;
         display: flex; align-items: center; justify-content: center;
         background: linear-gradient(#2c2c33, #1b1b20); border: 1px solid rgba(255, 255, 255, 0.16);
         border-bottom: 3px solid rgba(0, 0, 0, 0.6); box-shadow: var(--lift);
         color: var(--paper); font: 600 14px/1 var(--ui); }
  .cap.word { font-size: 12px; letter-spacing: 0.02em; }
  .times { margin-left: 2px; padding: 3px 7px; border-radius: 8px; background: var(--accent); color: #fff;
           font: 600 11px/14px var(--ui); letter-spacing: 0.02em; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 9px; border-radius: 11px;
          background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--lift);
          font: 600 12px/16px var(--ui); letter-spacing: 0.01em; }
  .chip svg { display: block; }
  .chip .count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip .caret { width: 2px; height: 14px; border-radius: 1px; background: var(--accent);
                 animation: caret 900ms steps(1) 4; }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---- "controlling input" banner */
  #banner { position: absolute; top: 44px; left: 50%; display: flex; align-items: center; gap: 10px;
            padding: 7px 9px 7px 13px; border-radius: 14px; background: var(--glass);
            border: 1px solid var(--glass-edge); box-shadow: var(--lift); white-space: nowrap;
            font: 600 13px/18px var(--ui); letter-spacing: 0.01em;
            opacity: 0; transform: translate(-50%, -10px);
            transition: opacity 200ms ease, transform 260ms var(--snap); }
  body.acting #banner, body.stopped #banner { opacity: 1; transform: translate(-50%, 0); }
  #banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  body.acting #banner .dot { animation: beacon 1400ms ease-out infinite; }
  @keyframes beacon { from { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.7); }
                      to { box-shadow: 0 0 0 9px rgba(var(--accent-rgb), 0); } }
  #banner .hint { display: flex; align-items: center; gap: 6px; padding-left: 10px; color: var(--muted);
                  font-weight: 500; border-left: 1px solid var(--glass-edge); }
  #banner .cap { min-width: 0; height: 20px; padding: 0 6px; border-radius: 5px; border-bottom-width: 2px;
                 font: 600 11px/1 var(--ui); letter-spacing: 0.02em; box-shadow: none; }
  body.stopped #banner { border-color: rgba(255, 179, 0, 0.45); }
  body.stopped #banner .dot { background: var(--warn); animation: none; }
  body.stopped #banner .hint { display: none; }

  /* ---- voice pill: listening / thinking / acting / speaking, and notices */
  #voice { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); display: none;
           align-items: center; gap: 9px; max-width: 70%; padding: 8px 16px 8px 13px; border-radius: 18px;
           background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--lift);
           font: 600 13px/18px var(--ui); letter-spacing: 0.01em; }
  #voice.show { display: flex; }
  #voice-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #voice .vdot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: #8a8a99; }
  #voice[data-state="listening"] .vdot { background: var(--accent); animation: beacon 1100ms ease-out infinite; }
  #voice[data-state="thinking"] .vdot { background: var(--warn); animation: blink 1200ms ease-in-out infinite; }
  #voice[data-state="acting"] .vdot { background: var(--accent); }
  #voice[data-state="speaking"] .vdot { background: var(--ok); animation: blink 600ms ease-in-out infinite; }
  #voice.notice { border-color: rgba(255, 179, 0, 0.5); }
  @keyframes blink { 50% { opacity: 0.3; } }

  @media (prefers-reduced-motion: reduce) {
    #banner { transform: translate(-50%, 0); transition: opacity 200ms ease; }
    body.acting #halo, body.acting #banner .dot, #voice .vdot, .chip .caret,
    #tag[data-buddy="thinking"] #buddy i { animation: none !important; }
    #grip { transition: opacity 120ms ease; transform: none; }
  }
</style>
</head>
<body>
  <svg id="paths" aria-hidden="true">
    <defs>
      <!-- Runs from the trail's oldest point (clear) to the tip (the accent). -->
      <linearGradient id="trail-grad" gradientUnits="userSpaceOnUse">
        <stop class="stop-accent" offset="0" stop-color="#ff2d95" stop-opacity="0"/>
        <stop class="stop-accent" offset="1" stop-color="#ff2d95" stop-opacity="0.62"/>
      </linearGradient>
    </defs>
    <path id="drag-under"/>
    <path id="drag-path"/>
    <path id="trail" fill="url(#trail-grad)"/>
  </svg>
  <div id="fx"></div>
  <!-- Shown whenever the assistant controls input (not visible to screenshots). -->
  <div id="banner"><span class="dot"></span><span id="banner-text">Rusty is controlling input</span><span class="hint"><span class="cap">esc</span>to stop</span></div>
  <div id="voice" data-state="idle"><span class="vdot"></span><span id="voice-text"></span></div>
  <div id="cursor">
    <div id="pose">
      <div id="halo"></div>
      <div id="lean">
        <!-- The tip is at (2,1) of the drawing; #arrow is offset so it sits on (0,0). -->
        <svg id="arrow" width="28" height="30" viewBox="0 0 28 30" aria-hidden="true">
          <defs>
            <linearGradient id="body" x1="0" y1="0" x2="0.55" y2="1">
              <stop class="stop-lit" offset="0" stop-color="#ff7cb9"/>
              <stop class="stop-accent" offset="0.55" stop-color="#ff2d95"/>
              <stop class="stop-deep" offset="1" stop-color="#cf1673"/>
            </linearGradient>
          </defs>
          <!-- Rusty, the logo (docs/brand): the rounded tip lands on (2,1). -->
          <g transform="translate(-6.14 -7.14) scale(0.16)">
            <path d="M46.12 71.59 A20 20 0 0 1 71.59 46.12 L197.59 90.12 A20 20 0 0 1 200.99 126.32 L153.64 153.64 L126.32 200.99 A20 20 0 0 1 90.12 197.59 Z" fill="url(#body)" stroke="#fff" stroke-width="13.75" stroke-linejoin="round"/>
            <!-- Eyes: #eyes looks where he is going, #eyes-x holds the mood,
                 each rect blinks (all three move on their own, see overlay.js). -->
            <g id="eyes"><g id="eyes-x">
              <rect class="eye" x="97" y="105" width="16" height="28" rx="8"/>
              <rect class="eye" x="127" y="105" width="16" height="28" rx="8"/>
            </g></g>
          </g>
        </svg>
      </div>
      <div id="grip"></div>
    </div>
    <div id="tag" class="empty"><span id="buddy" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="verb"></span><span id="name"></span></div>
  </div>
  <div id="hud"></div>
  <div id="caption" aria-live="polite"><span id="caption-text"></span></div>
  <script src="overlay.js"></script>
</body>
</html>
