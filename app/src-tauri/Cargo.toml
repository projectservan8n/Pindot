[package]
name = "pindot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pindot desktop app: overlay, tray, setup and settings, MCP server, voice loop"

[features]
# TEST ONLY: the --test-turn, --test-esc-after, --test-voice, --test-voice-esc
# and --keep-running flags and PINDOT_TEST_AUTO_APPROVE. Off by default;
# release builds never have it. Build with `--features test-switches`.
test-switches = ["pindot-core/test-switches"]

[lib]
name = "pindot_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
pindot-core = { path = "../../crates/pindot-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
