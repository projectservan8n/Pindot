[package]
name = "deskhand-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deskhand core: OS traits, MCP server, and the interactive claude brain"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rmcp = { version = "3.10", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2"
axum = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
rand = "0.9"
portable-pty = "0.9"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9.10"
enigo = "0.6.1"
objc2 = "0.6.5"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"

# Windows: stubs only in Phase 0. Phase 1 adds xcap and enigo here
# (see docs/windows-test-checklist.md).

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
