[package]
name = "deskhand-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deskhand core: OS traits, MCP server, and the interactive claude brain"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rmcp = { version = "3.10", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2"
axum = "0.8.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
rand = "0.9"
portable-pty = "0.9"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9.10"
enigo = "0.6.1"
objc2 = "0.6.5"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
# AXUIElement (accessibility tree, press, hit test). Same objc2 0.3 family.
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXActionConstants", "AXRoleConstants", "AXValueConstants"] }
# NSRunningApplication: pid -> app name and bundle id, activation.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray"] }

# Windows: stubs only (Phase 0 and 1). The Windows implementation adds xcap and enigo here
# (see docs/windows-test-checklist.md).

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
